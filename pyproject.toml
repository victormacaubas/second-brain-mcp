[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "MCP server exposing an Obsidian vault over stdio"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
second-brain-mcp = "second_brain_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain_mcp"]

